<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MR DRAGON – روابطي</title>
<meta name="theme-color" content="#06070a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#06070a;--card:#0a0c11;--line:#252a35;--tx:#f2f4f8;--mu:#8a93a6;--r:#ff2a3d;--g:#19ff6b;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--tx);min-height:100vh;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(30px + env(safe-area-inset-bottom,0px));background:radial-gradient(520px 320px at 100% 0,#ff2a3d2e,transparent),radial-gradient(520px 320px at 0 12%,#19ff6b24,transparent) var(--bg);background-repeat:no-repeat}
.wrap{max-width:480px;margin:0 auto;padding:2px;background:linear-gradient(160deg,var(--r),#1a1d26 35%,#1a1d26 65%,var(--g));clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,26px 100%,0 calc(100% - 26px))}
.card{background:var(--card);padding:30px 18px 24px;clip-path:polygon(0 0,calc(100% - 25px) 0,100% 25px,100% 100%,25px 100%,0 calc(100% - 25px))}
.hero{text-align:center;padding-bottom:6px}
.ring{width:142px;height:142px;margin:0 auto;border-radius:50%;padding:4px;background:conic-gradient(var(--r),var(--g),var(--r));animation:spin 9s linear infinite}
.ring div{width:100%;height:100%;border-radius:50%;background:var(--card);padding:4px}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;animation:spin 9s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.nm{margin-top:16px;font-size:25px;font-weight:900;line-height:1.5;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.nm bdi{unicode-bidi:isolate}
.sub{margin-top:2px;color:var(--mu);font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.vb{width:24px;height:24px;flex:none}
.ic{width:24px;height:24px;flex:none;display:block}
h2{margin:26px 0 10px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
h2 i{width:34px;height:34px;display:grid;place-items:center;background:#000;border:1px solid var(--line);flex:none;clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px))}
h2 span{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.ls{display:grid;gap:9px}
.b{display:flex;align-items:center;gap:12px;padding:13px 14px;background:#000;color:var(--tx);text-decoration:none;border-inline-start:3px solid var(--c);outline:1px solid #1b202b;outline-offset:-1px;clip-path:polygon(0 0,calc(100% - 13px) 0,100% 13px,100% 100%,13px 100%,0 calc(100% - 13px));transition:background .15s,transform .15s}
.b:hover,.b:focus-visible{background:#0e1218;transform:translateX(-3px)}
.b:focus-visible{outline:2px solid var(--g);outline-offset:-2px}
.b:active{transform:scale(.985)}
.bt{flex:1;min-width:0}
.bt b{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;line-height:1.5;flex-wrap:wrap}
.bt small{display:block;color:var(--mu);font-size:12px;direction:ltr;text-align:right;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.go{flex:none;padding:5px 13px;font-size:13px;font-weight:700;color:var(--c);border:1px solid var(--c);background:#ffffff08}
.fl{margin-top:26px;text-align:center;color:var(--mu);font-size:12px}
@media (prefers-reduced-motion:reduce){.ring,.ring img{animation:none}.b{transition:none}}
</style>
</head>
